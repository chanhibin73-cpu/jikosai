if(s==="数学②")html+=`<section class="panel"><h2>選択大問（第4〜7問から3問）</h2><div class="actions">${[4,5,6,7].map(n=>`<button class="btn ${state.selected.includes(n)?"primary":""}" onclick="toggleSelection(${n})">第${n}問 ${state.selected.includes(n)?"✓":""}</button>`).join("")}</div><p class="muted">選択されていない大問は入力・採点・進捗の対象外です。変更する場合は選択済みの1問を外してから別の1問を選んでください。</p></section>`;
let groups=[...new Set(rows(s).map(r=>r.group))];html+=groups.map(g=>{let rr=rows(s).filter(r=>r.group===g),pts=rr.reduce((a,r)=>a+r.points,0),got=rr.reduce((a,r)=>a+score(s,r),0);return `<section class="panel group"><h3 class="split"><span>${esc(g)}</span><small>${state.graded[s]?got+" / "+pts+" 点":rr.filter(r=>answer(s,r)).length+" / "+rr.length+" 入力"}</small></h3>${state.graded[s]?progress(got,pts):progress(rr.filter(r=>answer(s,r)).length,rr.length)}${rr.map(r=>{let a=answer(s,r),k=key(s,r),multi=r.answer.length>1,negative=r.answer.startsWith("-"),digits=multi?r.answer.length:1,values=Array.from({length:digits},(_,i)=>(state.parts?.[k]||a)[i]||"");let opts=Array.from({length:10},(_,i)=>String(i));if(s==="数学①"||s==="数学②")opts=["-",...opts];let marks=multi?values.map((v,i)=>`<div><small>${i+1}桁目</small><div class="marks">${opts.map(x=>`<button class="mark ${v===x?"selected":""}" onclick='setDigit(${JSON.stringify(s)},${r.row},${i},${JSON.stringify(x)},${digits})'>${x==="-"?"−":x}</button>`).join("")}</div></div>`).join(""):`<div class="marks">${opts.map(x=>`<button class="mark ${a===x?"selected":""}" onclick='choose(${JSON.stringify(s)},${r.row},${JSON.stringify(x)})'>${x==="-"?"−":x}</button>`).join("")}</div>`;return `<div class="question ${state.graded[s]&&a?(score(s,r)===r.points?"good":"wrong"):a?"done":""}"><div class="qhead"><div><strong>${esc(r.label)}</strong><br><small>${r.points}点　${esc(r.page||"")} ${esc(r.pdf||"")}</small></div><strong>${esc(a||"未入力")}</strong></div>${marks}<div class="actions" style="margin-top:10px"><button class="btn" onclick='clearAnswer(${JSON.stringify(s)},${r.row})'>入力を消す</button>${multi?`<small>${digits}桁を順に選択（先頭0も保持）</small>`:""}</div>${state.graded[s]?`<div class="result">${!a?"未入力":score(s,r)===r.points?"✓ 正解":"× 不正解"}　${score(s,r)} / ${r.points}点　正答：${esc(r.answer)}</div>`:""}<label class="review"><input type="checkbox" ${state.review[k]?"checked":""} onchange='toggleReview(${JSON.stringify(s)},${r.row},this.checked)'>復習する</label></div>`}).join("")}</section>`}).join("");html+=`<section class="panel"><h2>大問別分析</h2>${groups.map(g=>{let rr=rows(s).filter(r=>r.group===g),p=rr.reduce((a,r)=>a+r.points,0),v=rr.reduce((a,r)=>a+score(s,r),0);return `<div class="split"><span>${esc(g)}</span><strong>${state.graded[s]?v+" / "+p+"点":rr.filter(r=>answer(s,r)).length+" / "+rr.length+" 入力"}</strong></div>${state.graded[s]?progress(v,p):progress(rr.filter(r=>answer(s,r)).length,rr.length)}`}).join("")}</section>`;$("app").innerHTML=html}
function setDigit(s,row,i,v,len){let k=s+":"+row,a=(state.parts?.[k]||state.answers[k]||"").padEnd(len," ");let arr=[...a];arr[i]=arr[i]===v?" ":v;let val=arr.join("");state.parts??={};state.parts[k]=val;state.answers[k]=val.includes(" ")?"":val;state.graded[s]=false;save();render()}
function resetSubject(s){if(!confirm(s+"の入力・復習チェックをすべて削除しますか？"))return;DATA[s].rows.forEach(r=>{delete state.answers[key(s,r)];if(state.parts)delete state.parts[key(s,r)];delete state.review[key(s,r)]});state.graded[s]=false;save();render()}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCSV(){let rows=[["科目","大問","設問","自分のマーク","正答","配点","得点","状態","復習","手引き","PDF"]];subjects.forEach(s=>DATA[s].rows.forEach(r=>rows.push([s,r.group,r.label,answer(s,r),state.graded[s]?r.answer:"非公開",r.points,state.graded[s]&&active(s,r)?score(s,r):"",active(s,r)?answer(s,r)?"入力済":"未入力":"対象外",state.review[key(s,r)]?"✓":"",r.page||"",r.pdf||""])));download("共テ模試自己採点.csv","\ufeff"+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")}
function exportBackup(){download("共テ模試バックアップ.json",JSON.stringify({version:1,state},null,2),"application/json")}
function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(v.version!==1||!v.state||!v.state.answers||!v.state.selected)throw Error("形式が違います");if(confirm("現在の入力をバックアップの内容で上書きしますか？")){state={...state,...v.state};save();render()}}catch(err){alert("バックアップを読み込めません："+err.message)}};reader.readAsText(f);e.target.value=""}
render();</script></body></html>
